apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    compileSdkVersion rootProject.ext.compileSdkVersion

    lintOptions {
        abortOnError false
    }

    defaultConfig {
        applicationId "tv.danmaku.ijk.media.example"
        minSdkVersion rootProject.ext.minSdkVersion as int
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        
        // M3 Max Dev Optimization: Only build arm64 for debug
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            // Speed up builds by only compiling for the architecture of your M3 Mac or modern test device
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        if (requested.group == 'com.android.support') {
            if (!requested.name.startsWith("multidex")) {
                details.useVersion '25.3.0'
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation "androidx.constraintlayout:constraintlayout:2.0.4"
    implementation 'com.squareup:otto:1.3.8'
    implementation project(':ijkplayerview')
    implementation project(':ijkplayer-java')
    implementation project(':ijkplayer-exo')
    
    // Conditional inclusion to avoid heavy native compilation if not needed
    implementation project(':ijkplayer-arm64')
    // We keep v7a for release builds via standard dependency management
    implementation project(':ijkplayer-armv7a')

    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
